<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Portfolio with Macrophage Background</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
          font-family: 'Poppins', sans-serif;
          margin: 0;
          padding: 0;
          overflow-x: hidden;
          background: url('https://www.transparenttextures.com/patterns/dark-matter.png'), linear-gradient(135deg, #000428, #004e92);
          background-size: cover;
        }

        /* Navbar Styles */
        .navbar {
          background: rgba(0, 0, 0, 0.7);
        }
        .navbar .nav-link {
          color: white !important;
          font-weight: 500;
        }

        /* Hero Section */
        .hero {
          position: relative;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          color: white;
          overflow: hidden;
        }

        .hero-content {
          z-index: 10;
          position: relative;
        }

        .hero h1 {
          font-size: 3rem;
          font-weight: 600;
        }

        .hero p {
          font-size: 1.2rem;
          margin: 20px 0;
        }

        .hero .btn {
          margin: 10px;
          padding: 10px 20px;
          font-size: 1rem;
        }

        /* Macrophage Particles.js Background */
        #particles-js {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 1;
        }
    </style>
</head>
<body>

<!-- Hero Section -->
<section class="hero">
    <!-- Animated Background -->
    <div id="particles-js"></div>
    <!-- Hero Content -->
    <div class="hero-content">
        <h1>Welcome to My Immune System</h1>
        <p>Defending the body, one macrophage at a time.</p>
        <a class="btn btn-warning" href="#projects">View My Work</a>
        <a class="btn btn-outline-light" href="#contact">Get in Touch</a>
    </div>
</section>

<!-- Particles.js -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
    /* Initialize Macrophage-like Particles.js */
    particlesJS("particles-js", {
      "particles": {
        "number": {
          "value": 80,
          "density": {
            "enable": true,
            "value_area": 800
          }
        },
        "color": { "value": "#ffcc00" },
        "shape": {
          "type": "circle",
          "stroke": { "width": 0, "color": "#000000" },
          "polygon": { "nb_sides": 6 }
        },
        "opacity": {
          "value": 0.8,
          "random": true
        },
        "size": {
          "value": 6,
          "random": true
        },
        "line_linked": {
          "enable": true,
          "distance": 100,
          "color": "#ffcc00",
          "opacity": 0.6,
          "width": 2
        },
        "move": {
          "enable": true,
          "speed": 2,
          "direction": "none",
          "random": false,
          "straight": false,
          "out_mode": "out"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "repulse" },
          "onclick": { "enable": true, "mode": "push" },
          "resize": true
        },
        "modes": {
          "grab": { "distance": 140, "line_linked": { "opacity": 1 } },
          "repulse": { "distance": 200, "duration": 0.4 },
          "push": { "particles_nb": 4 }
        }
      },
      "retina_detect": true
    });
</script>
</body>
</html>
