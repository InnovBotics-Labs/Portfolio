# Render Blueprint — deploys the Next.js portfolio (+ tools) as a Node web service.
# This app is NOT a static site: it has SSR + a dynamic API route (/api/image-slots),
# so it must run `next start` on a Node server.
#
# Usage: Render dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: prabhukumar-sivamoorthy
    runtime: node
    plan: starter # free tier (512MB) often OOMs the Next build; starter is safer
    branch: dev/ver-1 # change to your deploy branch (e.g. Portfolio_AD) if needed
    buildCommand: npm ci && npm run build
    startCommand: npm run start # binds to $PORT via the start script
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
