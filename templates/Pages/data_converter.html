<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="description"
        content="Free Online Data Converter - JSON, XML, CSV, YAML. Convert between formats instantly.">
    <title>Data Converter - Prabhu's Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d', 950: '#450a0a' },
                        dark: { 900: '#0a0f1f', 800: '#111827', 700: '#1f2937', 600: '#374151' }
                    },
                    fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'], 'display': ['Outfit', 'sans-serif'], 'code': ['Fira Code', 'monospace'] },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0f1f 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .editor-textarea {
            font-family: 'Fira Code', monospace;
            tab-size: 2;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar for sleek look */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            border: 2px solid rgba(0, 0, 0, 0);
            /* Creates padding effect */
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* IDE Layout Styles */
        .ide-panel {
            background: #0d1117;
            /* VS Code dark bg */
            border: 1px solid #30363d;
        }

        .ide-tab {
            background: #0d1117;
            border-top: 2px solid #58a6ff;
            /* Active tab indicator color */
            color: #c9d1d9;
        }

        .ide-toolbar {
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .empty-state-pattern {
            background-image: radial-gradient(#30363d 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Tree View Styles */
        .tree-key {
            color: #569CD6;
        }

        .tree-string {
            color: #CE9178;
        }

        .tree-number {
            color: #B5CEA8;
        }

        .tree-boolean {
            color: #569CD6;
        }

        .tree-null {
            color: #569CD6;
        }

        .tree-toggle {
            cursor: pointer;
            user-select: none;
            color: #858585;
        }

        .tree-toggle:hover {
            color: #FFFFF0;
        }
    </style>
</head>

<body class="text-white/90 font-sans antialiased flex flex-col min-h-screen">
    <div id="converter-root" class="flex-1 flex flex-col"></div>

    <script>
        window.converterIconUrl = "{{ url_for('static', filename='assets/data_converter_icon_red_v5.png') }}";
    </script>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Header = () => (
            <header className="sticky top-0 z-50 transition-all duration-300 bg-transparent backdrop-blur-sm border-b border-white/5">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex items-center justify-between h-16">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 flex items-center justify-center rounded-xl overflow-hidden filter drop-shadow-[0_0_15px_rgba(248,113,113,0.3)]">
                                <img src={window.converterIconUrl} className="w-full h-full object-cover" alt="Logo" />
                            </div>
                            <div>
                                <h1 className="font-display font-bold text-lg text-white">Data Converter</h1>
                                <p className="text-xs text-white/50 hidden sm:block">JSON · XML · CSV · YAML</p>
                            </div>
                        </div>
                        <a href="/" className="px-4 py-1.5 rounded-full bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 hover:to-primary-400 text-white text-sm font-semibold shadow-lg shadow-primary-500/20 hover:shadow-primary-500/40 transition-all duration-300 transform hover:scale-105 flex items-center gap-2 group">
                            <i className="fas fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform"></i>
                            <span>Home</span>
                        </a>
                    </div>
                </div>
            </header>
        );

        // --- Tree View Components ---

        const JsonNode = ({ name, value, isLast, depth = 0, filter = '' }) => {
            const [expanded, setExpanded] = useState(true);

            // Check if this node matches filter (simple text match for now)
            const matchesFilter = (val) => {
                if (!filter) return true;
                const searchLower = filter.toLowerCase();
                // Check name (key) or value
                if (name && name.toLowerCase().includes(searchLower)) return true;
                if (val !== null && typeof val !== 'object' && String(val).toLowerCase().includes(searchLower)) return true;
                return false;
            };

            // If it's a leaf node, hide if it doesn't match
            if (value === null || typeof value !== 'object') {
                if (!matchesFilter(value)) return null;
            }

            // Indentation with guide line
            const indent = {
                paddingLeft: `${1.5}rem`,
                borderLeft: depth > 0 ? '1px solid rgba(255,255,255,0.08)' : 'none',
                marginLeft: depth > 0 ? '0.75rem' : 0
            };

            if (value === null) {
                return (
                    <div className="font-code text-xs relative group/line">
                        <div style={indent} className="py-1 hover:bg-white/5 rounded px-1 transition-colors">
                            <span className="tree-key opacity-80">{name ? `${name}: ` : ''}</span>
                            <span className="tree-null">null</span>
                            <span className="text-white/30">{!isLast && ','}</span>
                        </div>
                    </div>
                );
            }

            if (typeof value === 'boolean') {
                return (
                    <div className="font-code text-xs relative group/line">
                        <div style={indent} className="py-1 hover:bg-white/5 rounded px-1 transition-colors">
                            <span className="tree-key opacity-80">{name ? `${name}: ` : ''}</span>
                            <span className="tree-boolean font-semibold">{value.toString()}</span>
                            <span className="text-white/30">{!isLast && ','}</span>
                        </div>
                    </div>
                );
            }

            if (typeof value === 'number') {
                return (
                    <div className="font-code text-xs relative group/line">
                        <div style={indent} className="py-1 hover:bg-white/5 rounded px-1 transition-colors">
                            <span className="tree-key opacity-80">{name ? `${name}: ` : ''}</span>
                            <span className="tree-number">{value}</span>
                            <span className="text-white/30">{!isLast && ','}</span>
                        </div>
                    </div>
                );
            }

            if (typeof value === 'string') {
                return (
                    <div className="font-code text-xs relative group/line">
                        <div style={indent} className="py-1 hover:bg-white/5 rounded px-1 transition-colors break-words">
                            <span className="tree-key opacity-80">{name ? `${name}: ` : ''}</span>
                            <span className="tree-string">"{value}"</span>
                            <span className="text-white/30">{!isLast && ','}</span>
                        </div>
                    </div>
                );
            }

            const isArray = Array.isArray(value);
            const isEmpty = isArray ? value.length === 0 : Object.keys(value).length === 0;
            const openChar = isArray ? '[' : '{';
            const closeChar = isArray ? ']' : '}';

            // Auto-expand if filter is active
            if (filter && !expanded) setExpanded(true);

            return (
                <div className="font-code text-xs">
                    <div style={indent} className="py-1 hover:bg-white/5 rounded px-1 flex items-center gap-1 group transition-colors">
                        {!isEmpty && (
                            <i onClick={(e) => { e.stopPropagation(); setExpanded(!expanded); }}
                                className={`tree-toggle fas fa-caret-${expanded ? 'down' : 'right'} w-4 text-center transition-colors hover:text-white scale-90`}
                            ></i>
                        )}
                        {isEmpty && <span className="w-4"></span>}
                        <span className="tree-key opacity-80">{name ? `${name}: ` : ''}</span>
                        <span className="text-white/60 font-bold">{openChar}</span>
                        {!expanded && !isEmpty && <span className="text-white/30 italic mx-2 text-[10px]">{isArray ? `${value.length} items` : '...'}</span>}
                        {!expanded && <span className="text-white/60 font-bold">{closeChar}</span>}
                        {!expanded && <span className="text-white/30">{!isLast && ','}</span>}
                    </div>
                    {expanded && !isEmpty && (
                        <div className="relative">
                            {isArray ? (
                                value.map((item, i) => (
                                    <JsonNode key={i} value={item} isLast={i === value.length - 1} depth={depth + 1} filter={filter} />
                                ))
                            ) : (
                                Object.keys(value).map((key, i) => (
                                    <JsonNode key={key} name={key} value={value[key]} isLast={i === Object.keys(value).length - 1} depth={depth + 1} filter={filter} />
                                ))
                            )}
                            <div style={indent} className="py-0.5 mt-0.5 text-white/50">
                                <span className="text-white/60 font-bold">{closeChar}</span>
                                <span className="text-white/30">{!isLast && ','}</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const JsonTreeView = ({ data, filter }) => {
            if (!data) return <div className="p-8 text-center text-white/30 text-sm">Empty data</div>;
            let parsed = null;
            try {
                parsed = typeof data === 'string' ? JSON.parse(data) : data;
            } catch (e) {
                return (
                    <div className="p-8 flex flex-col items-center justify-center text-rose-400">
                        <i className="fas fa-exclamation-triangle text-2xl mb-2"></i>
                        <p className="text-sm">Tree View only works with valid JSON</p>
                        <p className="text-xs text-rose-400/50 mt-1">Please ensure your content is valid JSON to use this view.</p>
                    </div>
                );
            }

            return (
                <div className="p-4 overflow-auto h-full json-tree">
                    <JsonNode value={parsed} isLast={true} filter={filter} />
                </div>
            );
        };


        const Editor = ({ value, onChange, placeholder, readOnly, title, format, onFormatChange, onCopy, onDownload, onClear, onUpload }) => {
            const fileInputRef = useRef(null);
            const [viewMode, setViewMode] = useState('code'); // 'code' | 'tree'
            const [searchTerm, setSearchTerm] = useState('');

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    // Auto-detect format from extension
                    const ext = file.name.split('.').pop().toLowerCase();
                    const formatMap = { json: 'json', xml: 'xml', csv: 'csv', yaml: 'yaml', yml: 'yaml' };
                    const detectedFormat = formatMap[ext] || 'json';
                    onUpload(content, detectedFormat);
                };
                reader.readAsText(file);
                e.target.value = ''; // Reset for re-upload
            };

            const formatContent = (minify = false) => {
                if (!value) return;
                try {
                    const parsed = JSON.parse(value);
                    const formatted = JSON.stringify(parsed, null, minify ? 0 : 2);
                    onChange(formatted);
                } catch (e) { }
            };

            const lineCount = value ? value.split('\n').length : 0;
            const charCount = value ? value.length : 0;
            const isEmpty = !value || value.trim() === '';

            return (
                <div className="flex-1 flex flex-col ide-panel rounded-xl overflow-hidden shadow-2xl h-[600px] sm:h-[calc(100vh-240px)] min-h-[400px]">

                    {/* 1. IDE Tab Bar */}
                    <div className="flex items-center bg-[#010409] border-b border-[#30363d]">
                        <div className="flex items-center px-4 py-2 ide-tab border-r border-[#30363d] text-xs font-medium gap-2">
                            <i className={`fas fa-file-${format === 'json' ? 'code' : 'alt'} text-blue-400`}></i>
                            <span>{title === 'Input' ? 'source' : 'result'}.{format}</span>
                            <i className="fas fa-times text-white/20 hover:text-white cursor-pointer ml-2 text-[10px]" onClick={onClear}></i>
                        </div>
                        <div className="flex-1"></div>

                        {/* Format Selector in Tab Bar */}
                        <div className="px-2">
                            <select
                                value={format}
                                onChange={(e) => onFormatChange(e.target.value)}
                                className="bg-transparent text-xs text-white/50 hover:text-white focus:outline-none cursor-pointer"
                            >
                                <option value="json">JSON</option>
                                <option value="xml">XML</option>
                                <option value="csv">CSV</option>
                                <option value="yaml">YAML</option>
                            </select>
                        </div>
                    </div>

                    {/* 2. Secondary Toolbar */}
                    <div className="ide-toolbar flex items-center justify-between px-3 py-1.5 min-h-[36px]">
                        <div className="flex items-center gap-2">
                            {/* View Toggles */}
                            <div className="flex bg-[#30363d]/50 rounded p-0.5">
                                <button onClick={() => setViewMode('code')} className={`px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider transition-all ${viewMode === 'code' ? 'bg-[#58a6ff] text-white shadow-sm' : 'text-white/40 hover:text-white'}`}>Code</button>
                                <button onClick={() => setViewMode('tree')} className={`px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider transition-all ${viewMode === 'tree' ? 'bg-[#58a6ff] text-white shadow-sm' : 'text-white/40 hover:text-white'}`}>Tree</button>
                            </div>

                            {/* Search (Only in Tree) */}
                            <div className={`transition-all duration-300 overflow-hidden flex items-center ${viewMode === 'tree' ? 'w-32 opacity-100 ml-2' : 'w-0 opacity-0'}`}>
                                <div className="relative w-full">
                                    <i className="fas fa-search absolute left-2 top-1/2 -translate-y-1/2 text-[10px] text-white/30"></i>
                                    <input
                                        type="text"
                                        placeholder="Filter..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full bg-[#0d1117] border border-[#30363d] rounded-sm py-0.5 pl-6 pr-1 text-[10px] text-white focus:outline-none focus:border-[#58a6ff]"
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center gap-1">
                            {onUpload && (
                                <>
                                    <input ref={fileInputRef} type="file" accept=".json,.xml,.csv,.yaml,.yml" onChange={handleFileChange} className="hidden" />
                                    <button onClick={() => fileInputRef.current?.click()} className="p-1.5 rounded hover:bg-white/10 text-white/50 hover:text-emerald-400 transition-colors" title="Upload File">
                                        <i className="fas fa-upload text-xs"></i>
                                    </button>
                                </>
                            )}
                            {!readOnly && onChange && !isEmpty && (
                                <>
                                    <button onClick={() => formatContent(false)} className="p-1.5 rounded hover:bg-white/10 text-white/50 hover:text-amber-400 transition-colors" title="Beautify">
                                        <i className="fas fa-indent text-xs"></i>
                                    </button>
                                    <button onClick={() => formatContent(true)} className="p-1.5 rounded hover:bg-white/10 text-white/50 hover:text-amber-400 transition-colors" title="Minify">
                                        <i className="fas fa-align-justify text-xs"></i>
                                    </button>
                                </>
                            )}
                            <button onClick={onCopy} className="p-1.5 rounded hover:bg-white/10 text-white/50 hover:text-white transition-colors" title="Copy">
                                <i className="fas fa-copy text-xs"></i>
                            </button>
                            {onDownload && (
                                <button onClick={onDownload} className="p-1.5 rounded hover:bg-white/10 text-white/50 hover:text-cyan-400 transition-colors" title="Download">
                                    <i className="fas fa-download text-xs"></i>
                                </button>
                            )}
                        </div>
                    </div>

                    {/* 3. Editor Content */}
                    <div className="flex-1 relative bg-[#0d1117] overflow-hidden">
                        {isEmpty && viewMode === 'code' ? (
                            <div className="absolute inset-0 flex flex-col items-center justify-center text-white/20 empty-state-pattern select-none">
                                <i className="fas fa-code text-4xl mb-4 opacity-50"></i>
                                <p className="text-sm font-medium">Paste {format.toUpperCase()} here</p>
                                {onUpload && (
                                    <button onClick={() => fileInputRef.current?.click()} className="mt-4 px-4 py-2 rounded-full bg-[#161b22] border border-[#30363d] hover:border-[#58a6ff] hover:text-[#58a6ff] transition-all text-xs flex items-center gap-2">
                                        <i className="fas fa-upload"></i>
                                        <span>Or Upload File</span>
                                    </button>
                                )}
                            </div>
                        ) : null}

                        {viewMode === 'code' ? (
                            <textarea
                                value={value}
                                onChange={(e) => onChange && onChange(e.target.value)}
                                readOnly={readOnly}
                                className={`w-full h-full bg-transparent p-4 text-sm text-[#c9d1d9] resize-none focus:outline-none editor-textarea ${isEmpty ? 'opacity-0 relative z-10' : ''}`}
                                spellCheck="false"
                            />
                        ) : (
                            <div className="w-full h-full bg-[#0d1117]">
                                <JsonTreeView data={value} filter={searchTerm} />
                            </div>
                        )}
                    </div>

                    {/* 4. Status Bar */}
                    <div className="px-3 py-1 bg-[#161b22] border-t border-[#30363d] text-[10px] text-white/40 flex justify-between select-none font-code">
                        <div className="flex gap-4">
                            <span>Ln {lineCount}</span>
                            <span>Col {charCount}</span>
                        </div>
                        <div className="flex gap-4">
                            <span>UTF-8</span>
                            <span>{format.toUpperCase()}</span>
                        </div>
                    </div>
                </div>
            )
        };

        const App = () => {
            const [inputData, setInputData] = useState('');
            const [outputData, setOutputData] = useState('');
            const [inputFormat, setInputFormat] = useState('json');
            const [outputFormat, setOutputFormat] = useState('xml');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);
            const [notification, setNotification] = useState(null);

            const showNotification = (msg, type = 'success') => {
                setNotification({ message: msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleConvert = async () => {
                if (!inputData.trim()) return;
                setIsLoading(true);
                setError(null);

                try {
                    const response = await fetch('/api/convert-data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: inputData,
                            inputFormat,
                            outputFormat
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        setOutputData(result.data);
                        showNotification('Conversion successful!');
                    } else {
                        setError(result.error);
                        showNotification('Conversion failed', 'error');
                    }
                } catch (err) {
                    setError('Network error occurred');
                } finally {
                    setIsLoading(false);
                }
            };

            // Auto-convert on format change if data exists
            useEffect(() => {
                if (inputData && outputData) {
                    // Optional: handleConvert(); 
                    // But maybe user just wants to change format first. Let's keep it manual or debounce it.
                }
            }, [inputFormat, outputFormat]);

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                showNotification('Copied to clipboard');
            };

            const downloadFile = (content, format) => {
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `converted.${format}`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const swapEditors = () => {
                setInputData(outputData);
                setOutputData(inputData);
                const tempFmt = inputFormat;
                setInputFormat(outputFormat);
                setOutputFormat(tempFmt);
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    <Header />

                    {notification && (
                        <div className={`fixed top-20 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl fade-in ${notification.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'} text-white flex items-center gap-2`}>
                            <i className={`fas fa-${notification.type === 'error' ? 'exclamation' : 'check'}-circle`}></i>
                            {notification.message}
                        </div>
                    )}

                    <main className="flex-1 flex flex-col lg:flex-row overflow-hidden">

                        {/* LEFT PANE */}
                        <div className="flex-1 min-w-0 h-full flex flex-col">
                            <Editor
                                title="Input"
                                value={inputData}
                                onChange={setInputData}
                                placeholder="Paste your data here or upload a file..."
                                format={inputFormat}
                                onFormatChange={setInputFormat}
                                onCopy={() => copyToClipboard(inputData)}
                                onClear={() => setInputData('')}
                                onUpload={(content, detectedFormat) => {
                                    setInputData(content);
                                    setInputFormat(detectedFormat);
                                    showNotification(`Loaded ${detectedFormat.toUpperCase()} file`);
                                }}
                            />
                        </div>

                        {/* CENTRAL CONTROL BAR */}
                        <div className="w-full lg:w-12 bg-[#010409] border-y lg:border-y-0 lg:border-x border-[#30363d] flex lg:flex-col items-center justify-center gap-6 p-2 z-10 shadow-xl">
                            <button
                                onClick={handleConvert}
                                disabled={isLoading || !inputData}
                                className={`w-8 h-8 lg:w-8 lg:h-8 rounded-full flex items-center justify-center transition-all ${isLoading ? 'text-white/20 cursor-not-allowed' : 'text-blue-400 hover:text-white hover:bg-white/10 hover:scale-110'}`}
                                title="Convert"
                            >
                                <i className={`fas fa-${isLoading ? 'spinner fa-spin' : 'play'} text-lg`}></i>
                            </button>

                            <button
                                onClick={swapEditors}
                                className="w-8 h-8 rounded-full flex items-center justify-center text-white/20 hover:text-white hover:bg-white/10 transition-all"
                                title="Swap Input/Output"
                            >
                                <i className="fas fa-exchange-alt"></i>
                            </button>
                        </div>

                        {/* RIGHT PANE */}
                        <div className="flex-1 min-w-0 h-full flex flex-col relative">
                            <Editor
                                title="Output"
                                value={outputData}
                                readOnly={true}
                                placeholder="Result will appear here..."
                                format={outputFormat}
                                onFormatChange={setOutputFormat}
                                onCopy={() => copyToClipboard(outputData)}
                                onDownload={() => downloadFile(outputData, outputFormat)}
                            />
                            {error && (
                                <div className="absolute bottom-10 left-4 right-4 p-3 bg-red-900/80 border border-red-500/50 backdrop-blur rounded text-red-100 text-xs font-mono fade-in z-50 shadow-xl">
                                    <strong className="block mb-1 text-red-300">Error:</strong>
                                    {error}
                                </div>
                            )}
                        </div>

                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('converter-root')).render(<App />);
    </script>
</body>

</html>
