{% extends 'base.html' %}

{% block title %}Portal - Login/Register{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
  <!-- Background gradient overlay -->
  <div class="fixed inset-0 bg-gradient-to-br from-dark-800 via-primary-950 to-dark-900 -z-10"></div>

  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <a href="{{ url_for('home') }}" class="flex items-center justify-center gap-2 mb-8 group">
      <i class="fas fa-laptop-code text-2xl text-primary-400 group-hover:text-primary-300 transition-colors"></i>
      <span class="font-display font-bold text-xl text-white">
        <span class="text-primary-400 underline decoration-2 underline-offset-2">P</span>rabhukumar
        <span class="text-primary-400 underline decoration-2 underline-offset-2">S</span>ivamoorthy
      </span>
    </a>

    <!-- Auth Card -->
    <div class="relative">
      <!-- Glow Effect -->
      <div
        class="absolute -inset-1 bg-gradient-to-r from-primary-500/20 via-primary-600/20 to-primary-500/20 blur-xl rounded-3xl">
      </div>

      <div
        class="relative bg-gradient-to-br from-white/10 to-white/5 backdrop-blur-lg rounded-3xl p-8 border border-white/10">
        <!-- Lock Icon -->
        <div class="flex justify-center mb-6">
          <div
            class="w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-600 rounded-full flex items-center justify-center shadow-lg shadow-primary-500/25">
            <i class="fas fa-lock text-2xl text-white"></i>
          </div>
        </div>

        <h1 class="text-2xl font-display font-bold text-white text-center mb-2">Authentication Required</h1>
        <p class="text-white/60 text-center mb-8">Please login or register to access the portal</p>

        <!-- Login Button -->
        <a href="{{ url_for('login') }}"
          class="w-full flex items-center justify-center gap-2 px-6 py-4 mb-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-dark-900 font-semibold text-lg shadow-lg shadow-amber-500/25 hover:shadow-amber-500/40 transition-all duration-300 transform hover:scale-[1.02]">
          <i class="fas fa-sign-in-alt"></i>
          Login
        </a>

        <!-- Register Button -->
        <a href="{{ url_for('register') }}"
          class="w-full flex items-center justify-center gap-2 px-6 py-4 rounded-xl border-2 border-white/30 hover:border-white/50 text-white font-semibold text-lg hover:bg-white/10 transition-all duration-300 transform hover:scale-[1.02]">
          <i class="fas fa-user-plus"></i>
          Register
        </a>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-white/10"></div>
          <span class="text-white/40 text-sm">or</span>
          <div class="flex-1 h-px bg-white/10"></div>
        </div>

        <!-- Back to Home -->
        <a href="{{ url_for('home') }}"
          class="w-full flex items-center justify-center gap-2 px-6 py-3 rounded-xl text-white/60 hover:text-white hover:bg-white/5 transition-all duration-300">
          <i class="fas fa-arrow-left"></i>
          Back to Home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
