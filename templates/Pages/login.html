{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <!-- Background gradient overlay -->
    <div class="fixed inset-0 bg-gradient-to-br from-dark-800 via-primary-950 to-dark-900 -z-10"></div>

    <div class="w-full max-w-md">
        <!-- Brand Header -->
        <a href="{{ url_for('home') }}" class="flex items-center justify-center gap-2 mb-8 group">
            <i class="fas fa-laptop-code text-2xl text-primary-400 group-hover:text-primary-300 transition-colors"></i>
            <span class="font-display font-bold text-xl text-white">
                <span class="text-primary-400 underline decoration-2 underline-offset-2">P</span>rabhukumar
                <span class="text-primary-400 underline decoration-2 underline-offset-2">S</span>ivamoorthy
            </span>
        </a>

        <!-- Login Card -->
        <div class="relative">
            <!-- Glow Effect -->
            <div
                class="absolute -inset-1 bg-gradient-to-r from-primary-500/20 via-primary-600/20 to-primary-500/20 blur-xl rounded-3xl">
            </div>

            <div
                class="relative bg-gradient-to-br from-white/10 to-white/5 backdrop-blur-lg rounded-3xl p-8 border border-white/10">
                <!-- Icon -->
                <div class="flex justify-center mb-6">
                    <div
                        class="w-16 h-16 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/25">
                        <i class="fas fa-user text-2xl text-white"></i>
                    </div>
                </div>

                <h1 class="text-2xl font-display font-bold text-white text-center mb-2">Welcome Back</h1>
                <p class="text-white/60 text-center mb-8">Sign in to your account</p>

                <!-- Form -->
                <form method="POST" class="space-y-6">
                    {{ form.hidden_tag() }}

                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-white/80 mb-2">
                            <i class="fas fa-envelope mr-2 text-primary-400"></i>Email Address
                        </label>
                        <input type="email" name="email" id="email" required
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300"
                            placeholder="your.email@example.com">
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-white/80 mb-2">
                            <i class="fas fa-lock mr-2 text-primary-400"></i>Password
                        </label>
                        <input type="password" name="password" id="password" required
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300"
                            placeholder="••••••••">
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox"
                                class="w-4 h-4 rounded border-white/30 bg-white/5 text-primary-500 focus:ring-primary-500">
                            <span class="text-sm text-white/60">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-primary-400 hover:text-primary-300 transition-colors">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                        class="w-full flex items-center justify-center gap-2 px-6 py-4 rounded-xl bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 hover:to-primary-400 text-white font-semibold text-lg shadow-lg shadow-primary-500/25 hover:shadow-primary-500/40 transition-all duration-300 transform hover:scale-[1.02]">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center gap-4 my-6">
                    <div class="flex-1 h-px bg-white/10"></div>
                    <span class="text-white/40 text-sm">Don't have an account?</span>
                    <div class="flex-1 h-px bg-white/10"></div>
                </div>

                <!-- Register Link -->
                <a href="{{ url_for('register') }}"
                    class="w-full flex items-center justify-center gap-2 px-6 py-3 rounded-xl border-2 border-white/20 hover:border-white/40 text-white/70 hover:text-white font-medium transition-all duration-300">
                    <i class="fas fa-user-plus"></i>
                    Create an account
                </a>

                <!-- Back to Home -->
                <a href="{{ url_for('home') }}"
                    class="mt-4 w-full flex items-center justify-center gap-2 px-6 py-3 text-white/50 hover:text-white transition-all duration-300">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
