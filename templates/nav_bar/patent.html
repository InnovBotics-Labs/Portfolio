<!-- Patents Section -->
<div class="py-8">
    <!-- Section Header -->
    <div class="text-center mb-12">
        <h2 class="font-display text-3xl sm:text-4xl font-bold text-white mb-2">
            <i class="fas fa-lightbulb text-amber-400 mr-3"></i>Patents
        </h2>
        <p class="text-white/60">Intellectual Property & Innovations</p>
    </div>

    <!-- Patents List -->
    <div class="space-y-4">
        <!-- Patent 1 -->
        <div
            class="group bg-gradient-to-br from-white/10 to-white/5 backdrop-blur-sm rounded-2xl p-6 border border-white/10 hover:border-amber-500/50 transition-all duration-300 hover:transform hover:scale-[1.02]">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-start sm:items-center gap-4">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Seal_of_the_United_States_Patent_and_Trademark_Office.svg"
                        alt="USPTO Logo"
                        class="w-12 h-12 sm:w-16 sm:h-16 object-contain opacity-80 group-hover:opacity-100 transition-opacity">
                    <div>
                        <h3 class="text-lg font-bold text-white mb-1">
                            Non-Destructive LBA Formatted Size Change Using Format Command
                        </h3>
                        <p class="text-sm text-white/50 flex flex-wrap gap-2">
                            <span class="px-2 py-0.5 bg-white/10 rounded-full text-xs">NVMe</span>
                            <span class="px-2 py-0.5 bg-white/10 rounded-full text-xs">PCIe</span>
                            <span class="px-2 py-0.5 bg-white/10 rounded-full text-xs">SSD</span>
                            <span class="px-2 py-0.5 bg-white/10 rounded-full text-xs">Storage Devices</span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-4 ml-16 sm:ml-0">
                    <span
                        class="px-3 py-1.5 bg-green-500/20 text-green-400 text-sm font-semibold rounded-full whitespace-nowrap">
                        <i class="fas fa-check-circle mr-1"></i>Submitted
                    </span>
                    <img src="{{url_for('static', filename='assets/SanDisk.svg')}}" alt="SanDisk Logo"
                        class="h-6 w-auto object-contain opacity-60 group-hover:opacity-100 transition-opacity hidden sm:block">
                </div>
            </div>
        </div>

        <!-- Patent 2 -->
        <div
            class="group bg-gradient-to-br from-white/10 to-white/5 backdrop-blur-sm rounded-2xl p-6 border border-white/10 hover:border-amber-500/50 transition-all duration-300 hover:transform hover:scale-[1.02]">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-start sm:items-center gap-4">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Seal_of_the_United_States_Patent_and_Trademark_Office.svg"
                        alt="USPTO Logo"
                        class="w-12 h-12 sm:w-16 sm:h-16 object-contain opacity-80 group-hover:opacity-100 transition-opacity">
                    <div>
                        <h3 class="text-lg font-bold text-white mb-1 flex items-center gap-2">
                            <i class="fas fa-lock text-amber-400"></i>
                            * * * * * * *
                        </h3>
                        <p class="text-sm text-white/50 flex flex-wrap gap-2">
                            <span class="px-2 py-0.5 bg-white/10 rounded-full text-xs">NVMe</span>
                            <span class="px-2 py-0.5 bg-white/10 rounded-full text-xs">PCIe</span>
                            <span class="px-2 py-0.5 bg-white/10 rounded-full text-xs">SSD</span>
                            <span class="px-2 py-0.5 bg-white/10 rounded-full text-xs">Storage Devices</span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-4 ml-16 sm:ml-0">
                    <span
                        class="px-3 py-1.5 bg-amber-500/20 text-amber-400 text-sm font-semibold rounded-full whitespace-nowrap">
                        <i class="fas fa-eye-slash mr-1"></i>Confidential
                    </span>
                    <img src="{{url_for('static', filename='assets/SanDisk.svg')}}" alt="SanDisk Logo"
                        class="h-6 w-auto object-contain opacity-60 group-hover:opacity-100 transition-opacity hidden sm:block">
                </div>
            </div>
        </div>
    </div>
</div>
