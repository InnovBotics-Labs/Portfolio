<!-- Contact Section -->
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
	<!-- Section Header -->
	<div class="text-center mb-12">
		<h2 class="font-display text-3xl sm:text-4xl lg:text-5xl font-bold text-white">
			Get In Touch / <span
				class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-500">Ping me</span>
		</h2>
		<p class="mt-4 text-white/60 text-lg max-w-2xl mx-auto">
			Have a question or want to work together? Drop me a message!
		</p>
	</div>

	<!-- Contact Form Card -->
	<div class="relative">
		<!-- Glow Effect -->
		<div
			class="absolute -inset-1 bg-gradient-to-r from-primary-500/20 via-primary-600/20 to-primary-500/20 blur-xl rounded-3xl">
		</div>

		<div
			class="relative bg-gradient-to-br from-white/10 to-white/5 backdrop-blur-lg rounded-3xl p-6 sm:p-8 lg:p-10 border border-white/10">
			<form action="/ping" method="POST" class="space-y-6">
				{{ form.hidden_tag() }}

				<!-- Email Field -->
				<div>
					<label for="email" class="block text-sm font-medium text-white/80 mb-2">
						<i class="fas fa-envelope mr-2 text-primary-400"></i>Email Address
					</label>
					<input type="email" name="email" id="email" required
						class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300"
						placeholder="your.email@example.com">
				</div>

				<!-- Name Fields -->
				<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
					<div>
						<label for="f_name" class="block text-sm font-medium text-white/80 mb-2">
							<i class="fas fa-user mr-2 text-primary-400"></i>First Name
						</label>
						<input type="text" name="f_name" id="f_name" required
							class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300"
							placeholder="John">
					</div>
					<div>
						<label for="l_name" class="block text-sm font-medium text-white/80 mb-2">
							Last Name
						</label>
						<input type="text" name="l_name" id="l_name" required
							class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300"
							placeholder="Doe">
					</div>
				</div>

				<!-- Phone Fields -->
				<div class="grid grid-cols-3 sm:grid-cols-4 gap-4">
					<div class="col-span-1">
						<label for="country_code" class="block text-sm font-medium text-white/80 mb-2">
							<i class="fas fa-globe mr-2 text-primary-400"></i>Code
						</label>
						<input type="text" name="country_code" id="country_code" required
							class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300"
							placeholder="+1">
					</div>
					<div class="col-span-2 sm:col-span-3">
						<label for="phone" class="block text-sm font-medium text-white/80 mb-2">
							<i class="fas fa-phone mr-2 text-primary-400"></i>Phone Number
						</label>
						<input type="tel" name="phone" id="phone" required pattern="[0-9]{10}"
							class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300"
							placeholder="1234567890">
					</div>
				</div>

				<!-- Message Field -->
				<div>
					<label for="message" class="block text-sm font-medium text-white/80 mb-2">
						<i class="fas fa-comment-alt mr-2 text-primary-400"></i>Your Message
					</label>
					<textarea name="message" id="message" rows="5" required
						class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300 resize-none"
						placeholder="Tell me about your project or ask any questions..."></textarea>
				</div>

				<!-- Submit Button -->
				<div class="pt-4">
					<button type="submit"
						class="w-full sm:w-auto group relative px-8 py-4 rounded-full bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 hover:to-primary-400 text-white font-semibold text-lg shadow-xl shadow-primary-500/25 hover:shadow-primary-500/40 transition-all duration-300 transform hover:scale-105">
						<span class="flex items-center justify-center gap-2">
							<i
								class="fas fa-paper-plane group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
							Send Message
						</span>
					</button>
				</div>
			</form>
		</div>
	</div>
</div>
